<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640"
     font-family="Helvetica, Arial, sans-serif" role="img"
     aria-label="Shore-based counter-USV attack and defense interface">
  <title>Attack and defense meet at a small interface: claimed class plus track features</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arrowOff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6a6a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>

  <!-- ============ threat source ============ -->
  <rect x="28" y="190" width="140" height="64" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="1.5"/>
  <text x="98" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Incoming craft</text>
  <text x="98" y="235" text-anchor="middle" font-size="11" fill="#333333">(hostile USV)</text>

  <line x1="98" y1="254" x2="98" y2="266" stroke="#b3261e" stroke-width="1.3" stroke-dasharray="4 3"/>

  <rect x="28" y="266" width="140" height="88" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="98" y="289" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c1d16">Attacker controls</text>
  <text x="98" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c1d16">appearance only</text>
  <text x="42" y="325" font-size="10.5" fill="#5c1310">&#8226; adversarial patch</text>
  <text x="42" y="341" font-size="10.5" fill="#5c1310">&#8226; benign hull / paint</text>

  <!-- ============ sensing ============ -->
  <line x1="168" y1="210" x2="222" y2="142" stroke="#b3261e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="168" y1="242" x2="222" y2="352" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="224" y="100" width="136" height="58" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="1.5"/>
  <text x="292" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Shore EO camera</text>
  <text x="292" y="142" text-anchor="middle" font-size="10" fill="#333333">near-waterline view</text>
  <text x="292" y="177" text-anchor="middle" font-size="10" font-style="italic" fill="#b3261e">channel the attacker can reach</text>

  <text x="292" y="316" text-anchor="middle" font-size="10" font-style="italic" fill="#333333">separate channel &#8212; a patch</text>
  <text x="292" y="330" text-anchor="middle" font-size="10" font-style="italic" fill="#333333">cannot invent a bearing rate</text>
  <rect x="224" y="340" width="136" height="58" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="1.5"/>
  <text x="292" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Coastal radar</text>
  <text x="292" y="382" text-anchor="middle" font-size="10" fill="#333333">range + bearing</text>

  <!-- ============ perception ============ -->
  <line x1="360" y1="129" x2="412" y2="129" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="360" y1="369" x2="412" y2="369" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="414" y="100" width="150" height="58" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="1.5"/>
  <text x="489" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">EO detector</text>
  <text x="489" y="142" text-anchor="middle" font-size="10" fill="#333333">asserts a class</text>

  <rect x="414" y="340" width="150" height="58" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="1.5"/>
  <text x="489" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Radar tracker</text>
  <text x="489" y="382" text-anchor="middle" font-size="10" fill="#333333">world-frame track</text>

  <!-- ============ the interface ============ -->
  <line x1="564" y1="129" x2="610" y2="129" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="564" y1="369" x2="610" y2="369" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="643" y="76" text-anchor="middle" font-size="10.5" font-style="italic" fill="#333333">attack / defense interface</text>
  <rect x="612" y="88" width="62" height="322" rx="10" fill="#fafafa" stroke="#333333" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="643" y="249" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111"
        transform="rotate(-90 643 249)">claimed class &#160;+&#160; track features</text>

  <!-- ============ defense ============ -->
  <line x1="674" y1="132" x2="722" y2="132" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="674" y1="300" x2="722" y2="300" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="724" y="96" width="252" height="88" rx="8" fill="#eaf1fb" stroke="#1a4f8a" stroke-width="1.5"/>
  <text x="850" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f3563">Presence check</text>
  <text x="850" y="136" text-anchor="middle" font-size="10.5" fill="#123f75">radar track with no EO detection</text>
  <text x="850" y="151" text-anchor="middle" font-size="10" fill="#4a6f9c">(reads detection only, not the claimed class)</text>
  <text x="850" y="172" text-anchor="middle" font-size="10" font-style="italic" fill="#1a4f8a">catches evasion &#8212; RQ1</text>

  <rect x="724" y="206" width="252" height="204" rx="8" fill="#eaf1fb" stroke="#1a4f8a" stroke-width="1.5"/>
  <text x="850" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f3563">Consistency check</text>
  <text x="850" y="248" text-anchor="middle" font-size="10.5" fill="#123f75">does the claimed class match</text>
  <text x="850" y="263" text-anchor="middle" font-size="10.5" fill="#123f75">how the craft is actually moving?</text>

  <rect x="738" y="276" width="224" height="46" rx="6" fill="#ffffff" stroke="#1a4f8a" stroke-width="1"/>
  <text x="750" y="294" font-size="11" font-weight="bold" fill="#0f3563">Kinematics</text>
  <text x="750" y="311" font-size="9.5" fill="#333333">speed &#183; straightness &#183; loiter &#183; turn rate</text>

  <rect x="738" y="330" width="224" height="52" rx="6" fill="#ffffff" stroke="#1a4f8a" stroke-width="1"/>
  <circle cx="753" cy="347" r="5.5" fill="none" stroke="#1a4f8a" stroke-width="1"/>
  <circle cx="753" cy="347" r="1.8" fill="#1a4f8a"/>
  <text x="766" y="351" font-size="11" font-weight="bold" fill="#0f3563">Geometry vs defended asset</text>
  <text x="750" y="370" font-size="9.5" fill="#333333">closing rate &#183; bearing stability &#183; closest approach</text>

  <text x="850" y="400" text-anchor="middle" font-size="10" font-style="italic" fill="#1a4f8a">catches disguise &#8212; RQ2; cost of mimicry &#8212; RQ3</text>

  <!-- ============ decision ============ -->
  <line x1="976" y1="134" x2="1022" y2="238" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="976" y1="300" x2="1022" y2="272" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="1024" y="214" width="130" height="82" rx="8" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="1089" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">Decision</text>
  <text x="1089" y="266" text-anchor="middle" font-size="11" fill="#333333">flag / pass</text>

  <!-- ============ offline training path ============ -->
  <rect x="414" y="492" width="196" height="66" rx="8" fill="#efefef" stroke="#6a6a6a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="512" y="518" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333333">Real benign AIS tracks</text>
  <text x="512" y="535" text-anchor="middle" font-size="10" fill="#4a4a4a">historical &#183; benign only</text>

  <line x1="610" y1="525" x2="674" y2="525" stroke="#6a6a6a" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowOff)"/>

  <rect x="676" y="492" width="200" height="66" rx="8" fill="#efefef" stroke="#6a6a6a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="776" y="518" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333333">Benign envelope model</text>
  <text x="776" y="535" text-anchor="middle" font-size="10" fill="#4a4a4a">one envelope per benign class</text>

  <line x1="800" y1="492" x2="850" y2="414" stroke="#6a6a6a" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowOff)"/>

  <text x="645" y="588" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4a4a4a">Offline training only &#8212; AIS is never read at runtime, and no hostile tracks enter the model.</text>

  <!-- ============ legend ============ -->
  <line x1="44" y1="500" x2="86" y2="500" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="94" y="504" font-size="10" fill="#333333">runtime data flow</text>
  <line x1="44" y1="526" x2="86" y2="526" stroke="#6a6a6a" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowOff)"/>
  <text x="94" y="530" font-size="10" fill="#333333">offline training</text>
</svg>
